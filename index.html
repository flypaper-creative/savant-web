<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <title>Savant — Chamber Ignition</title>

  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>

  <style>
    :root{
      --bg:#030303;
      --gold:#ffd27a;
      --gold2:#fff0c7;
      --dim:rgba(255,232,190,.48);
      --line:rgba(255,215,140,.14);
      --ease:cubic-bezier(.22,1,.36,1);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      color:#fff;
      font-family:Inter,Arial,sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 50% 44%, rgba(255,170,60,.055), transparent 22%),
        radial-gradient(circle at 50% 50%, rgba(255,200,120,.03), transparent 36%),
        linear-gradient(180deg, #050505 0%, #010101 100%);
    }

    #bg3d{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      z-index:0;
    }

    .fx-noise,
    .fx-vignette{
      position:fixed;
      inset:0;
      pointer-events:none;
    }

    .fx-noise{
      z-index:2;
      opacity:.018;
      mix-blend-mode:overlay;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:256px 256px;
      animation:noiseShift .24s steps(3) infinite;
    }

    .fx-vignette{
      z-index:3;
      background:
        radial-gradient(circle at 50% 50%, transparent 0 34%, rgba(0,0,0,.14) 58%, rgba(0,0,0,.66) 100%);
    }

    .preloader{
      position:fixed;
      inset:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:opacity .7s var(--ease), visibility .7s var(--ease);
    }

    .preloader.hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .preloader-core{
      position:relative;
      width:min(92vw, 560px);
      aspect-ratio:1/1;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }

    .preloader-meta{
      position:absolute;
      left:50%;
      bottom:11%;
      transform:translateX(-50%);
      width:min(74vw, 320px);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }

    .preloader-percent{
      font-family:Orbitron, monospace;
      font-size:clamp(26px, 5vw, 42px);
      letter-spacing:.18em;
      color:var(--gold2);
      text-shadow:0 0 18px rgba(255,208,115,.15);
    }

    .preloader-bar{
      width:100%;
      height:4px;
      border-radius:999px;
      overflow:hidden;
      background:rgba(255,255,255,.06);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
    }

    .preloader-fill{
      width:0%;
      height:100%;
      background:linear-gradient(90deg, #ffb23c, #fff0c7);
      box-shadow:0 0 18px rgba(255,190,90,.45);
      transition:width .12s linear;
    }

    .preloader-label{
      font-size:10px;
      letter-spacing:.28em;
      text-transform:uppercase;
      color:var(--dim);
      text-align:center;
      line-height:1.7;
    }

    .init-btn{
      position:absolute;
      left:50%;
      bottom:-8%;
      transform:translateX(-50%);
      min-width:min(74vw, 300px);
      padding:1rem 1.4rem;
      border:none;
      border-radius:14px;
      background:
        linear-gradient(180deg, rgba(12,12,12,.82), rgba(4,4,4,.95));
      color:var(--gold2);
      font-size:12px;
      letter-spacing:.34em;
      text-transform:uppercase;
      border:1px solid rgba(255,215,140,.18);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.02),
        0 0 24px rgba(255,183,72,.08);
      clip-path:polygon(8% 0, 100% 0, 100% 78%, 92% 100%, 0 100%, 0 22%);
      opacity:0;
      pointer-events:none;
      transition:opacity .5s var(--ease), border-color .24s var(--ease), box-shadow .24s var(--ease), transform .24s var(--ease);
    }

    .init-btn.ready{
      opacity:1;
      pointer-events:auto;
    }

    .init-btn:hover{
      border-color:rgba(255,215,140,.36);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.025),
        0 0 34px rgba(255,183,72,.14);
      transform:translateX(-50%) translateY(-1px);
    }

    .shell{
      position:relative;
      z-index:4;
      opacity:0;
      transition:opacity .7s var(--ease);
    }

    .shell.live{opacity:1}

    @keyframes noiseShift{
      0%{transform:translate(0,0)}
      33%{transform:translate(1px,-1px)}
      66%{transform:translate(-1px,1px)}
      100%{transform:translate(0,0)}
    }
  </style>
</head>
<body>
  <canvas id="bg3d"></canvas>
  <div class="fx-noise"></div>
  <div class="fx-vignette"></div>

  <div class="preloader" id="preloader">
    <div class="preloader-core">
      <div class="preloader-meta">
        <div class="preloader-percent" id="preloadPercent">000%</div>
        <div class="preloader-bar"><div class="preloader-fill" id="preloadFill"></div></div>
        <div class="preloader-label">savant // ghost architecture //<br>chamber ignition</div>
      </div>
      <button class="init-btn" id="initBtn">initialize</button>
    </div>
  </div>

  <div class="shell" id="shell"></div>

  <script type="module" src="./logo7-reactor.js?v=1776837999"></script>
</body>
</html>
